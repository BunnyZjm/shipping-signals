name: Weekly edition

on:
  schedule:
    # 00:00 UTC every Monday = 08:00 Asia/Shanghai
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set edition date
        run: echo "EDITION_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect candidates
        run: python3 scripts/collect.py --date "$EDITION_DATE"

      - name: Check AI key
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            {
              echo "### 缺少 AI_API_KEY，未生成周报"
              echo ""
              echo "请在仓库 Settings → Secrets and variables → Actions → Repository secrets 添加 \`AI_API_KEY\`，值为 OpenRouter 的 API Key。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "缺少 AI_API_KEY，请在仓库 Secrets 中添加后重跑。" >&2
            exit 1
          fi

      - name: Compose edition
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python3 scripts/compose.py --date "$EDITION_DATE"

      - name: Rebuild index
        run: python3 scripts/build_index.py

      - name: Validate
        run: python3 scripts/validate_data.py --strict

      - name: Commit data
        run: |
          git config user.name "shipping-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new edition was produced; nothing to commit."
          else
            git commit -m "weekly: publish edition $EDITION_DATE"
            git push
          fi

      - name: Upload automation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-automation
          path: |
            automation/candidates.json
            automation/drafts/
            automation/articles/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare static bundle
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R index.html assets data dist/
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Check Pages artifact
        run: |
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('artifacts:', [a.get('name') for a in d.get('artifacts', [])])"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
